services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoops-api
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoops-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
